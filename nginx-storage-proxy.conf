# Nginx Reverse Proxy Configuration for MinIO Storage
# Place this in /etc/nginx/sites-available/storage-proxy
#
# Reverse Proxy Server: 203.81.66.115 (kaunghtet)
# Command: ssh -i ~/.ssh/ciservers -p 3 kaunghtet@203.81.66.115
#
# Install:
#   sudo cp nginx-storage-proxy.conf /etc/nginx/sites-available/storage-proxy
#   sudo ln -s /etc/nginx/sites-available/storage-proxy /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

# Catch-all for storage.{any-tenant-domain}
server {
    listen 443 ssl http2;
    server_name ~^storage\.(?<tenant_domain>.+)$;

    # SSL Configuration (adjust paths to your certificates)
    # You may use wildcard cert or Let's Encrypt
    ssl_certificate /etc/ssl/certs/wildcard.crt;
    ssl_certificate_key /etc/ssl/private/wildcard.key;

    # Or use Let's Encrypt (recommended)
    # ssl_certificate /etc/letsencrypt/live/storage.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/storage.example.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Large file uploads (adjust as needed)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Disable request buffering for streaming uploads
    proxy_request_buffering off;

    # Logging
    access_log /var/log/nginx/storage-access.log;
    error_log /var/log/nginx/storage-error.log;

    # Proxy to internal MinIO server
    location / {
        # Internal MinIO endpoint
        proxy_pass http://192.168.200.33:9000;

        # Preserve original headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for MinIO console)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large files
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_buffer_size 4k;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name ~^storage\.(?<tenant_domain>.+)$;

    return 301 https://$host$request_uri;
}

# Optional: MinIO Console access (if needed)
# Access via console.storage.{domain}
server {
    listen 443 ssl http2;
    server_name ~^console\.storage\.(?<tenant_domain>.+)$;

    ssl_certificate /etc/ssl/certs/wildcard.crt;
    ssl_certificate_key /etc/ssl/private/wildcard.key;

    location / {
        proxy_pass http://192.168.200.33:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
