apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: ciapp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      containers:
      - name: core
        image: 192.168.200.41/ciapp-frontend/core:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: ciapp-frontend
spec:
  selector:
    app: core
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publicweb
  namespace: ciapp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: publicweb
  template:
    metadata:
      labels:
        app: publicweb
    spec:
      containers:
      - name: publicweb
        image: 192.168.200.41/ciapp-frontend/publicweb:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: publicweb
  namespace: ciapp-frontend
spec:
  selector:
    app: publicweb
  ports:
  - port: 80
    targetPort: 3001
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: ciapp-frontend
spec:
  rules:
  - host: core.ciapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: core
            port:
              number: 80
  - host: publicweb.ciapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: publicweb
            port:
              number: 80