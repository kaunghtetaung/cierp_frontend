---
# Example of how to apply this secret:
# kubectl apply -f secrets.yaml
#
# To create secrets from command line (more secure):
# kubectl create secret generic frontend-secrets \
#   --from-literal=tenant-api-client-id='your-actual-client-id' \
#   --from-literal=tenant-api-client-secret='your-actual-client-secret' \
#   --from-literal=redis-password='your-actual-redis-password' \
#   --from-literal=minio-root-user='your-actual-minio-user' \
#   --from-literal=minio-root-password='your-actual-minio-password' \
#   -n ciapp-frontend
#
# To verify secrets are created:
# kubectl get secrets -n ciapp-frontend
#
# To view secret details (base64 encoded):
# kubectl get secret frontend-secrets -n ciapp-frontend -o yaml
#
# SECURITY NOTES:
# 1. NEVER commit actual production credentials to Git
# 2. Use a secure secret management system (Vault, Sealed Secrets, etc.)
# 3. Rotate credentials regularly
# 4. Limit access to the namespace with RBAC
# 5. Consider using external secret operators for production