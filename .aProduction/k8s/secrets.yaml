  tenant-api-client-id: "f63672873ab7908f14f889c9a4d1b0747b8036257aa08c3568f5b1aa102f75d2"
  tenant-api-client-secret: "T7uAqmC0utEiQO4ifCDvlnscjFTxaV8/XLPngmA7phCCif8mZy25MrTTu9OaDRPs"

