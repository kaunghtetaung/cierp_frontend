apiVersion: apps/v1
kind: Deployment
metadata:
  name: publicweb
  namespace: ciapp-frontend
  labels:
    app: publicweb
    service: publicweb
    tier: frontend
    priority: high
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: publicweb
  template:
    metadata:
      labels:
        app: publicweb
        service: publicweb
        tier: frontend
        priority: high
    spec:
      # Deploy only on worker nodes
      nodeSelector:
        node-role.kubernetes.io/worker: "true"

      containers:
      - name: publicweb
        image: 192.168.200.41/ciapp-frontend/publicWeb:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.mmhub.info"
        - name: NEXT_PUBLIC_APP_URL
          value: "https://www.mmhub.info"
        - name: NEXT_PUBLIC_OIDC_ISSUER
          value: "https://auth.mmhub.info"
        - name: NEXT_PUBLIC_OIDC_CLIENT_ID
          value: "publicweb-client"
        - name: REDIS_HOST
          value: "192.168.200.32"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: "redis_password_here"
        - name: REDIS_DB
          value: "1"
        - name: SESSION_SECRET
          value: "your-session-secret-here"
        - name: MINIO_ENDPOINT
          value: "192.168.200.33"
        - name: MINIO_PORT
          value: "9000"
        - name: MINIO_ACCESS_KEY
          value: "minio_access_key"
        - name: MINIO_SECRET_KEY
          value: "minio_secret_key"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: publicweb
  namespace: ciapp-frontend
  labels:
    app: publicweb
spec:
  type: ClusterIP
  selector:
    app: publicweb
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http