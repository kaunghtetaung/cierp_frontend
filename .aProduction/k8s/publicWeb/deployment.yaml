apiVersion: apps/v1
kind: Deployment
metadata:
  name: publicweb
  namespace: ciapp-frontend
  labels:
    app: publicweb
    service: publicweb
    tier: frontend
    priority: high
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: publicweb
  template:
    metadata:
      labels:
        app: publicweb
        service: publicweb
        tier: frontend
        priority: high
    spec:
      # Deploy only on worker-2 (worker-1 has proxy issues)
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-2

      # Override DNS for API domains to use internal reverse proxy
      # This avoids NAT firewall issues with external DNS
      hostAliases:
      - ip: "192.168.200.3"
        hostnames:
        - "api.crystal-image.net"
        - "auth.crystal-image.net"
        - "api.um1ygn.edu.mm"
        - "auth.um1ygn.edu.mm"
        - "api.um2ygn.edu.mm"
        - "auth.um2ygn.edu.mm"
        - "api.udmylibrary.edu.mm"
        - "auth.udmylibrary.edu.mm"
        - "api.hrh.gov.mm"
        - "auth.hrh.gov.mm"
        - "api.uopygn.edu.mm"
        - "auth.uopygn.edu.mm"
        - "api.uopygn.gov.mm"
        - "auth.uopygn.gov.mm"
        - "api.uopmdy.gov.mm"
        - "auth.uopmdy.gov.mm"
        - "api.ummg.edu.mm"
        - "auth.ummg.edu.mm"
        - "api.umty.edu.mm"
        - "auth.umty.edu.mm"
        - "api.umty.edu.mm"
        - "auth.umty.gov.mm"
        - "api.uch.gov.mm"
        - "auth.uch.gov.mm"

      containers:
      - name: publicweb
        image: 192.168.200.41/ciappfrontend/publicweb:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3002"
        # Config Service
        - name: ENABLE_CONFIG_HOT_RELOAD
          value: "true"
        - name: CONFIG_SERVICE_URL
          value: "http://config.ciapp-backend.svc.cluster.local:3330"
        - name: CONFIG_SERVICE_APP_NAME
          value: "publicWeb"
        - name: CONFIG_SERVICE_ENVIRONMENT
          value: "production"
        - name: CONFIG_REFRESH_INTERVAL
          value: "300000"
        - name: CONFIG_DEBUG
          value: "false"
        # OIDC Configuration
        - name: TENANT_API_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: frontend-secrets
              key: tenant-api-client-id
        - name: TENANT_API_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-secrets
              key: tenant-api-client-secret
        # Redis
        - name: REDIS_HOST
          value: "192.168.200.32"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: frontend-secrets
              key: redis-password
        - name: REDIS_USERNAME
          value: "cidbaccess"
        - name: REDIS_DB
          value: "0"
        # Cache TTL
        - name: CACHE_TTL_DEFAULT
          value: "3600"
        - name: CACHE_TTL_TENANT_SETTINGS
          value: "1800"
        - name: CACHE_TTL_USER_SESSION
          value: "7200"
        - name: CACHE_TTL_AUTH_TOKEN
          value: "900"
        - name: CACHE_TTL_CONTENT
          value: "600"
        # PDF Service
        - name: PDF_SERVICE_URL
          value: "http://pdf-service.ciapp-backend.svc.cluster.local:3338"
        - name: PDF_SERVICE_TIMEOUT
          value: "30000"
        # Logging
        - name: LOG_FORMAT
          value: "json"
        - name: NEXT_PUBLIC_ENABLE_CONSOLE_LOGGER
          value: "false"
        # MinIO/S3
        - name: MINIO_ENDPOINT
          value: "192.168.200.33"
        - name: MINIO_PORT
          value: "9000"
        - name: MINIO_USE_SSL
          value: "false"
        - name: MINIO_REGION
          value: "us-east-1"
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: frontend-secrets
              key: minio-root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: frontend-secrets
              key: minio-root-password
        - name: MINIO_BUCKET_STRATEGY
          value: "per-tenant"
        - name: MINIO_PUBLIC_ENDPOINT_TEMPLATE
          value: "storage.{tenantRootDomain}"
        - name: MINIO_PUBLIC_PORT
          value: "443"
        - name: MINIO_PUBLIC_USE_SSL
          value: "true"
        # API Subdomains
        - name: API_SUBDOMAIN
          value: "api"
        - name: AUTH_SUBDOMAIN
          value: "auth"
        - name: NEXT_PUBLIC_API_SUBDOMAIN
          value: "api"
        - name: NEXT_PUBLIC_AUTH_SUBDOMAIN
          value: "auth"
        # Next.js
        - name: NEXT_PUBLIC_APP_URL
          value: "https://www.um1ygn.edu.mm"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: publicweb
  namespace: ciapp-frontend
  labels:
    app: publicweb
spec:
  type: ClusterIP
  selector:
    app: publicweb
  ports:
  - port: 3000
    targetPort: 3002
    protocol: TCP
    name: http